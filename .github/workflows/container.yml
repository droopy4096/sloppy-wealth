# Build the container image (Containerfile) on every version tag and publish it to the
# GitHub container registry: ghcr.io/<owner>/<repo>, then add the image (pull command,
# tags, digest) to the tag's GitHub Release, creating the release if there is none.
# The test gates run first; nothing is published if they fail.
#
# Tags are plain semver without a "v" prefix (owner's convention):
#   git tag 0.1.0 && git push upstream 0.1.0
#   -> ghcr.io/droopy4096/sloppy-wealth:0.1.0, :0.1, :latest
#   0.2.0-rc.1 -> :0.2.0-rc.1 only (a pre-release does not move latest)
name: container

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:        # rebuild by hand (Actions tab); tagged with the branch/tag name

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install -r requirements.txt
      - name: Web and API tests
        run: python -m unittest -q test_engine test_keep_payment test_ui_emitters test_api test_docs
      - name: Engine tests
        run: python -m unittest discover -s state_machine/tests -t .
      - name: Golden check
        run: python state_machine/tools/update_golden.py --check

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create / edit the GitHub Release of the tag
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          # latest only for a plain release tag (1.2.3), not a pre-release (1.2.3-rc.1)
          flavor: |
            latest=auto
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Add the image to the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: .github/scripts/release-container-notes.sh "$TAG" "$IMAGE" "$DIGEST" "$TAGS" linux/amd64,linux/arm64
